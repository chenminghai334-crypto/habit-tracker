<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>习惯打卡</title>
<meta name="description" content="自己定义每天要做的习惯，到点提醒，一键打卡。数据保存在本机。">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="习惯打卡">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="file-warning" class="file-warning" hidden>
  <span>📄 本地文件模式：打卡、统计、备份、导出日历都能正常用。但浏览器不允许本地文件发系统通知，也不能装成 App —— 想要到点弹通知，请改用「启动.cmd」打开，或访问部署后的网址。</span>
  <button type="button" id="file-warning-close">知道了</button>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">✓</span><span>习惯打卡</span></div>
    <nav class="nav" id="nav-desktop"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✓</span><span>习惯打卡</span></div>
      <div class="topbar-date" id="topbar-date"></div>
    </header>
    <div class="banners" id="banners" hidden></div>
    <main class="view" id="view"></main>
  </div>
</div>

<nav class="tabbar" id="nav-mobile"></nav>
<div class="toast" id="toast" hidden></div>

<script>
  (function () {
    if (location.protocol !== 'file:') return;
    var box = document.getElementById('file-warning');
    var seen = false;
    try {
      seen = localStorage.getItem('habitTracker:fileNoticeSeen') === '1';
    } catch (e) {}
    if (seen) return;
    box.hidden = false;
    document.getElementById('file-warning-close').addEventListener('click', function () {
      try {
        localStorage.setItem('habitTracker:fileNoticeSeen', '1');
      } catch (e) {}
      box.hidden = true;
    });
  })();
</script>
<script src="./logic.js"></script>
<script src="./app.js"></script>
</body>
</html>
